<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <title>Generic Category Grouping Game</title>

        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    </head>
    <body>
        <center id="header">Create four groups of four!</center>
        <br />

        <div id="boards">
            <div id="answer-board"></div>
            <div id="game-board"></div>
        </div>

        <br />

        <div id="mistakes-remaining-container">Mistakes Remaining: <span id="mistakes-remaining" \></div>

        <br />

        <div class="controls-container">
            <button id="shuffle">Shuffle</button>
            <button id="deselect">Deselect All</button>
            <button id="submit">Submit</button>
        </div>

        <div id="next-game-container">
            <img src="ami.gif" id="success-image" />
            <button id="success-button"></button>
        </div>

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
        <script src="script.js"></script>
    </body>
</html>
